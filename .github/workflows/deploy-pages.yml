name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run install:all

      - name: Build site for GitHub Pages
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          VITE_GITHUB_PAGES: "true"
          # Cloudflare R2 custom domain (see README — Hosting on Cloudflare)
          VITE_WINDOWS_INSTALLER_URL: https://downloads.starcraftcoach.com/Starcraft-Coach-Setup.exe?v=4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
