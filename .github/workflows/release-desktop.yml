name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run install:all

      - name: Build and publish desktop app
        run: npm run build:desktop && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing (Step 2) — add repo secrets WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify update metadata
        shell: bash
        run: |
          test -f release/latest.yml || (echo "latest.yml missing — auto-update will not work" && exit 1)
          ls -la release/

      - name: Upload installer to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_OBJECT_KEY: Starcraft-Coach-Setup.exe
          R2_PUBLIC_URL: https://downloads.starcraftcoach.com/Starcraft-Coach-Setup.exe
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "R2_BUCKET secret not set — skipping R2 upload"
            exit 0
          fi
          node scripts/upload-installer-to-r2.cjs

      - name: Print hosting instructions
        run: node scripts/publish-installer-url.cjs
