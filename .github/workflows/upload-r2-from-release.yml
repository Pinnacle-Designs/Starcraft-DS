name: Upload Release to R2

# Re-upload an existing GitHub Release .exe to R2 without rebuilding.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0) or "latest"
        required: false
        default: latest

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release installer
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          tag="${RELEASE_TAG:-latest}"
          if [ "$tag" = "latest" ]; then
            api="https://api.github.com/repos/Pinnacle-Designs/Starcraft-DS/releases/latest"
          else
            api="https://api.github.com/repos/Pinnacle-Designs/Starcraft-DS/releases/tags/${tag}"
          fi
          echo "Fetching release metadata from: $api"
          release_json=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api")
          asset_url=$(echo "$release_json" | jq -r '.assets[] | select(.name | test("\\.exe$")) | .browser_download_url' | head -1)
          asset_name=$(echo "$release_json" | jq -r '.assets[] | select(.name | test("\\.exe$")) | .name' | head -1)
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "::error::No .exe asset found for release tag '${tag}'."
            echo "Available releases: https://github.com/Pinnacle-Designs/Starcraft-DS/releases"
            exit 1
          fi
          echo "Downloading ${asset_name}"
          curl -fsSL -L -o "release/${asset_name}" "$asset_url"
          ls -la release/

      - name: Upload to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_OBJECT_KEY: Starcraft-Coach-Setup.exe
          R2_PUBLIC_URL: https://downloads.starcraftcoach.com/Starcraft-Coach-Setup.exe
          AWS_DEFAULT_REGION: auto
        run: bash scripts/upload-to-r2-awscli.sh
