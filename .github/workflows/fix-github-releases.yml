name: Fix GitHub Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-duplicate-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove duplicate releases missing latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cleanup-duplicate-github-releases.cjs
