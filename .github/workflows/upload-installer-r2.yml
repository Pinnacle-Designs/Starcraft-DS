name: Upload Installer to R2

# Manual upload only — use after building locally or re-running from a release artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Windows installer
        run: |
          npm ci
          npm run install:all
          npm run build:desktop
          npx electron-builder --win --config.win.signAndEditExecutable=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_OBJECT_KEY: Starcraft-Coach-Setup.exe
          R2_PUBLIC_URL: https://downloads.starcraftcoach.com/Starcraft-Coach-Setup.exe
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "Add R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and R2_BUCKET secrets first."
            exit 1
          fi
          node scripts/upload-installer-to-r2.cjs
